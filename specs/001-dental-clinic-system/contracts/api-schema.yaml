openapi: 3.0.3
info:
  title: Dental Clinic Management API
  description: |
    API for the Dental Clinic Appointment Management System.
    This API is primarily accessed through Supabase client libraries,
    but this schema documents the available operations.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: https://{project-ref}.supabase.co/rest/v1
    description: Supabase REST API

security:
  - bearerAuth: []

tags:
  - name: Patients
    description: Patient management operations
  - name: Appointments
    description: Appointment scheduling and management
  - name: Services
    description: Dental services catalog
  - name: Schedule
    description: Clinic schedule management
  - name: Knowledge Base
    description: AI knowledge base management
  - name: Conversations
    description: WhatsApp conversation history

paths:
  /patients:
    get:
      tags: [Patients]
      summary: List all patients
      description: Retrieve paginated list of patients with optional search
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: "*"
        - name: phone
          in: query
          description: Filter by exact phone number
          schema:
            type: string
        - name: name
          in: query
          description: Filter by name (partial match)
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            default: created_at.desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
    post:
      tags: [Patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreate'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '409':
          description: Phone number already exists

  /patients/{id}:
    get:
      tags: [Patients]
      summary: Get patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: select
          in: query
          description: Include related data
          schema:
            type: string
            example: "*,appointments(*),conversations(*)"
      responses:
        '200':
          description: Patient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientWithRelations'
        '404':
          description: Patient not found
    patch:
      tags: [Patients]
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      parameters:
        - name: select
          in: query
          schema:
            type: string
            default: "*,patient:patients(*),service:services(*)"
        - name: appointment_date
          in: query
          description: Filter by date (eq, gte, lte)
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled, no_show]
        - name: patient_id
          in: query
          schema:
            type: string
            format: uuid
        - name: order
          in: query
          schema:
            type: string
            default: appointment_date.asc,appointment_time.asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentWithRelations'
    post:
      tags: [Appointments]
      summary: Create appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '409':
          description: Time slot not available

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentWithRelations'
    patch:
      tags: [Appointments]
      summary: Update appointment
      description: |
        Update appointment details or status.
        Status changes trigger n8n workflows:
        - pending -> confirmed: Sends confirmation WhatsApp
        - * -> cancelled: Sends cancellation with alternatives
        - * -> no_show: Sends follow-up message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /rpc/get_available_slots:
    post:
      tags: [Appointments]
      summary: Get available appointment slots
      description: Returns available time slots for a given date and service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_date, p_service_id]
              properties:
                p_date:
                  type: string
                  format: date
                  description: Date to check availability
                p_service_id:
                  type: string
                  format: uuid
                  description: Service ID (determines slot duration)
      responses:
        '200':
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slot_time:
                      type: string
                      format: time
                    slot_end:
                      type: string
                      format: time

  /services:
    get:
      tags: [Services]
      summary: List all services
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      tags: [Services]
      summary: Create service (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Service created

  /services/{id}:
    patch:
      tags: [Services]
      summary: Update service (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
      responses:
        '200':
          description: Service updated

  /clinic_schedule:
    get:
      tags: [Schedule]
      summary: Get clinic schedule
      responses:
        '200':
          description: Weekly schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicSchedule'
    patch:
      tags: [Schedule]
      summary: Update schedule for a day (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicScheduleUpdate'
      responses:
        '200':
          description: Schedule updated

  /blocked_dates:
    get:
      tags: [Schedule]
      summary: List blocked dates
      parameters:
        - name: blocked_date
          in: query
          description: Filter dates >= this value
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of blocked dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedDate'
    post:
      tags: [Schedule]
      summary: Block a date (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedDateCreate'
      responses:
        '201':
          description: Date blocked

  /blocked_dates/{id}:
    delete:
      tags: [Schedule]
      summary: Unblock a date (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Date unblocked

  /knowledge_base:
    get:
      tags: [Knowledge Base]
      summary: List knowledge base entries
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [faq, service, policy, general]
        - name: is_active
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Knowledge base entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBaseEntry'
    post:
      tags: [Knowledge Base]
      summary: Create knowledge base entry (admin only)
      description: Creates entry and generates embedding via Edge Function
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseCreate'
      responses:
        '201':
          description: Entry created

  /rpc/search_knowledge_base:
    post:
      tags: [Knowledge Base]
      summary: Semantic search knowledge base
      description: Search using vector similarity (used by AI agent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query_embedding]
              properties:
                query_embedding:
                  type: array
                  items:
                    type: number
                  description: 1536-dimensional embedding vector
                match_count:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Matching entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    title:
                      type: string
                    content:
                      type: string
                    similarity:
                      type: number

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations for a patient
      parameters:
        - name: patient_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: order
          in: query
          schema:
            type: string
            default: created_at.asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'

  /staff:
    get:
      tags: [Staff]
      summary: List staff members
      responses:
        '200':
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Staff'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token

  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PatientCreate:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
          description: E.164 format (+971501234567)
        email:
          type: string
        notes:
          type: string

    PatientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        notes:
          type: string

    PatientWithRelations:
      allOf:
        - $ref: '#/components/schemas/Patient'
        - type: object
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/Appointment'
            conversations:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'

    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        duration_minutes:
          type: integer
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled, no_show]
        notes:
          type: string
          nullable: true
        reminded:
          type: boolean
        cancelled_by:
          type: string
          nullable: true
          enum: [assistant, patient]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true

    AppointmentCreate:
      type: object
      required: [patient_id, service_id, appointment_date, appointment_time]
      properties:
        patient_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        duration_minutes:
          type: integer
        status:
          type: string
          enum: [pending, confirmed]
          default: pending
        notes:
          type: string

    AppointmentUpdate:
      type: object
      properties:
        appointment_date:
          type: string
          format: date
        appointment_time:
          type: string
          format: time
        service_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled, no_show]
        notes:
          type: string
        cancelled_by:
          type: string
          enum: [assistant, patient]

    AppointmentWithRelations:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          properties:
            patient:
              $ref: '#/components/schemas/Patient'
            service:
              $ref: '#/components/schemas/Service'

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        name_ar:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        duration_minutes:
          type: integer
        is_active:
          type: boolean

    ServiceCreate:
      type: object
      required: [name, name_ar]
      properties:
        name:
          type: string
        name_ar:
          type: string
        description:
          type: string
        price:
          type: number
        duration_minutes:
          type: integer
          default: 30

    ServiceUpdate:
      type: object
      properties:
        name:
          type: string
        name_ar:
          type: string
        description:
          type: string
        price:
          type: number
        duration_minutes:
          type: integer
        is_active:
          type: boolean

    ClinicSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        is_active:
          type: boolean
        slot_duration_minutes:
          type: integer

    ClinicScheduleUpdate:
      type: object
      properties:
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        is_active:
          type: boolean
        slot_duration_minutes:
          type: integer

    BlockedDate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        blocked_date:
          type: string
          format: date
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    BlockedDateCreate:
      type: object
      required: [blocked_date]
      properties:
        blocked_date:
          type: string
          format: date
        reason:
          type: string

    KnowledgeBaseEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [faq, service, policy, general]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    KnowledgeBaseCreate:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        category:
          type: string
          enum: [faq, service, policy, general]

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        message:
          type: string
        sender:
          type: string
          enum: [patient, ai_agent]
        message_type:
          type: string
          default: text
        whatsapp_message_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [admin, assistant, doctor]
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
